syntax = "proto3";

package nn.proto;

message Tensor {
  repeated uint64 shape = 1;
  repeated float values = 2;
}

message Parameters {
  Tensor weights = 1;
  Tensor biases = 2;
}

message DenseLayer {
  uint64 input_size = 1;
  uint64 output_size = 2;
  repeated uint64 expected_input_shape = 3;
  repeated uint64 expected_output_shape = 4;
}

message ConvolutionalLayer {
  uint64 input_channels = 1;
  uint64 input_length = 2;
  uint64 output_channels = 3;
  uint64 kernel_size = 4;
  uint64 stride = 5;
  uint64 padding = 6;
}

message FlattenLayer {
  repeated uint64 expected_input_shape = 1;
}

message HopfieldLayer {
  uint64 size = 1;
  repeated uint64 expected_shape = 2;
}

message Layer {
  string name = 1;
  string type = 2;
  string info = 3;
  string activation = 4;
  Parameters parameters = 5;

  oneof kind {
    DenseLayer dense = 10;
    ConvolutionalLayer convolutional = 11;
    FlattenLayer flatten = 12;
    HopfieldLayer hopfield = 13;
  }
}

message Model {
  uint32 format_version = 1;
  repeated Layer layers = 2;
}
